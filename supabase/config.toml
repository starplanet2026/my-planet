project_id = "my-planet"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_request_size = "1MB"

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# 手机号注册/登录（密码方式）。关闭手机确认后，手机注册直接建立会话、不发短信，
# 因此无需配置 SMS 服务商；若以后要做短信验证码登录，需改为 true 并配置 [auth.sms.xxx] 服务商
[auth.sms]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true

[functions]
[functions.asr]
verify_jwt = false
