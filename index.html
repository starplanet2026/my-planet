<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/planet.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <title>My Planet - 我的星球</title>
  </head>
  <body>
    <div id="root">
      <!-- JS 加载前的加载动画，避免白屏 -->
      <div id="app-loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fffdf0;gap:16px;font-family:'PingFang SC',sans-serif;">
        <div style="width:48px;height:48px;border:4px solid #ffe670;border-top-color:#ffc700;border-radius:50%;animation:app-spin 0.8s linear infinite;"></div>
        <div style="color:#cc8500;font-size:16px;">正在加载星球...</div>
      </div>
      <style>@keyframes app-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
